[package]
name = "rctpower_protocol"
version = "0.0.1"
edition = "2024"
description = "RCT Power inverter serial/TCP protocol"
repository = "https://github.com/Hessdev-de/rctpower-protocol"
homepage = "https://energy2mqtt.org"
readme = "README.md"
keywords = ["rct", "power", "inverter", "battery", "protocol"]
categories = ["hardware-support", "network-programming"]

[features]
default = []
cli = ["dep:clap", "dep:anyhow", "dep:tokio", "async"]
async = ["dep:tokio", "dep:log", "dep:env_logger"]

[dependencies]
thiserror = "2"
clap = { version = "4", features = ["derive"], optional = true }
anyhow = { version = "1", optional = true }
log = { version = "0.4", optional = true }
env_logger = { version = "0.11", optional = true }
tokio = { version = "1", features = ["net", "io-util", "rt", "rt-multi-thread", "time", "sync", "macros"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["net", "io-util", "rt", "rt-multi-thread", "time", "macros", "process"] }

[[example]]
name = "rct"
required-features = ["cli"]

[[example]]
name = "rct_proxy"
required-features = ["cli"]
