[package]
name = "rctpower-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RCT Power inverter serial/TCP protocol"
repository = "https://github.com/Hessdev-de/rctpower-protocol"
homepage = "https://energy2mqtt.org"
licence = "GPL-3.0-only"
readme = "README.md"
keywords = ["rct", "power", "inverter", "battery", "protocol"]
categories = ["hardware-support", "network-programming"]

[features]
default = []
cli = ["dep:clap", "dep:anyhow"]

[dependencies]
thiserror = "2"
clap = { version = "4", features = ["derive"], optional = true }
anyhow = { version = "1", optional = true }

[[example]]
name = "rct"
required-features = ["cli"]
